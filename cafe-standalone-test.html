<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catmint Café — test build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#eef1e3; --panel:#fdfbf3; --panel-2:#f3efe0; --line:#ddd7c2;
    --ink:#2e2a22; --ink-soft:#6a6552; --ink-faint:#9a947e;
    --accent:#3f8159; --accent-bright:#4fae76; --gold:#d9a94e; --rose:#d8768a;
    --wood:#c99a63; --wood-dark:#a97a45;
    --shadow:0 2px 10px rgba(40,34,20,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;margin:0;}
  button{font:inherit;}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;
    background:linear-gradient(180deg,var(--ground),#e6ead8);}

  /* ---- HUD ---- */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    padding:.7rem .9rem;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:2;}
  .hud-name{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;display:flex;align-items:baseline;gap:.4rem;}
  .hud-name .tag{font-family:"Hanken Grotesk",sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;padding:.1rem .45rem;}
  .hud-stats{display:flex;align-items:center;gap:.6rem;}
  .hud-stats .coin{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .hud-stats .level{font-weight:700;color:var(--accent);white-space:nowrap;}
  .xpbar{width:4.6rem;height:.4rem;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));width:0%;transition:width .35s ease;}

  /* ---- the room: one continuous café scene, not a settings panel ---- */
  .room{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.8rem;
    background:
      radial-gradient(circle at 18px 18px, rgba(0,0,0,.035) 2px, transparent 2.4px) 0 0/36px 36px,
      linear-gradient(180deg,#f2eedd,#e9e4cc);}
  .section-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
    margin:0 0 .35rem .1rem;}

  /* the counter: where you choose what to cook */
  .counter{display:flex;gap:.5rem;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:.7rem;box-shadow:var(--shadow);}
  .station{flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center;min-width:0;}
  .station .sname{font-size:.72rem;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:.25rem;}
  .chip-row{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;}
  .chip{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;
    padding:.3rem .4rem;font-size:1.15rem;cursor:pointer;line-height:1;}
  .chip:active{transform:translateY(1px);}
  .cook-dish{font-size:1.7rem;line-height:1;}
  .cookbar{width:100%;height:.4rem;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);}
  .cookbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0c878);width:0%;transition:width .2s linear;}
  .collect-btn{appearance:none;border:0;border-radius:12px;padding:.3rem .6rem;font-weight:700;font-size:.76rem;
    background:var(--accent);color:#fff;cursor:pointer;animation:bounce 1s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .stuck-note{font-size:.66rem;color:var(--rose);font-weight:700;}

  /* the pass: dishes ready to serve — tap one to send it out */
  .pass{display:flex;gap:.5rem;background:var(--panel-2);border:1.5px dashed var(--line);border-radius:16px;
    padding:.55rem;min-height:3.3rem;align-items:center;}
  .pass-slot{width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;flex:0 0 auto;}
  .pass-slot.empty{border:1.5px dashed var(--line);opacity:.5;}
  .pass-slot.full{background:var(--panel);box-shadow:var(--shadow);cursor:pointer;
    animation:pulseGlow 1.6s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(63,129,89,.35)}50%{box-shadow:0 0 0 7px rgba(63,129,89,0)}}
  .pass-hint{font-size:.7rem;color:var(--ink-faint);padding-left:.2rem;}

  /* the floor: tables around the room */
  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:.7rem .5rem;}
  .table{display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:default;}
  .table-top{position:relative;width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;
    font-size:1.9rem;background:radial-gradient(circle at 35% 30%, var(--wood), var(--wood-dark));
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), var(--shadow);}
  .table.empty .table-top{background:transparent;box-shadow:none;border:2px dashed var(--line);opacity:.6;}
  .table.seated .table-top{animation:popIn .22s ease-out;}
  .table.leaving .table-top{animation:leaveOut .4s ease-in forwards;}
  @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes leaveOut{to{transform:scale(.35);opacity:0}}
  .want-bubble{position:absolute;top:-.6rem;right:-.3rem;width:1.7rem;height:1.7rem;border-radius:50%;
    background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:1rem;
    border:1.5px solid var(--gold);}
  .want-bubble.matched{border-color:var(--accent);}
  .name{font-size:.68rem;color:var(--ink-soft);font-weight:600;}
  .patience{width:80%;height:.24rem;border-radius:999px;background:var(--panel-2);overflow:hidden;}
  .patience i{display:block;height:100%;background:var(--rose);transition:width .2s linear;}

  /* ---- toolbar ---- */
  .toolbar{display:flex;gap:.6rem;padding:.7rem .9rem;background:var(--panel);border-top:1px solid var(--line);}
  .toolbar button{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:12px;padding:.65rem;font-weight:700;font-size:.86rem;cursor:pointer;}
  .toolbar button:active{transform:translateY(1px);}

  /* ---- modal ---- */
  .backdrop{position:fixed;inset:0;background:rgba(30,26,18,.4);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;}
  @media(min-width:560px){.backdrop{align-items:center;}}
  .backdrop[hidden]{display:none;}
  .modal{background:var(--panel);width:100%;max-width:520px;max-height:82dvh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:1.1rem 1.1rem 1.4rem;box-shadow:0 -8px 30px rgba(20,16,8,.2);}
  @media(min-width:560px){.modal{border-radius:20px;}}
  .modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;}
  .modal .x{border:1px solid var(--line);background:#fff;border-radius:50%;width:1.9rem;height:1.9rem;cursor:pointer;color:var(--ink-soft);}
  .recipe-row,.shop-row{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-top:1px solid var(--line);}
  .recipe-row:first-of-type,.shop-row:first-of-type{border-top:none;}
  .recipe-row .ic,.shop-row .ic{font-size:1.6rem;width:2.2rem;text-align:center;}
  .recipe-row .info,.shop-row .info{flex:1;}
  .recipe-row .info b,.shop-row .info b{display:block;font-size:.92rem;}
  .recipe-row .info span,.shop-row .info span{font-size:.76rem;color:var(--ink-soft);}
  .recipe-row.locked{opacity:.5;}
  .buy-btn{appearance:none;border:0;border-radius:999px;padding:.45rem .8rem;font-weight:700;font-size:.8rem;
    background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;}
  .buy-btn:disabled{background:var(--panel-2);color:var(--ink-faint);cursor:default;}
  .soon-tag{display:inline-block;margin-left:.3rem;padding:.05rem .45rem;border-radius:999px;background:var(--panel-2);
    color:var(--ink-faint);font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}

  /* ---- toasts + floaters ---- */
  .toasts{position:fixed;left:50%;top:.8rem;transform:translateX(-50%);z-index:80;
    display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:min(92vw,480px);}
  .toast{background:var(--ink);color:#fef9ec;padding:.5rem .9rem;border-radius:999px;font-size:.82rem;font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;}
  .toast.on{opacity:1;transform:translateY(0);}
  .floater{position:fixed;font-weight:800;color:var(--accent);font-size:.95rem;pointer-events:none;z-index:60;
    animation:floatUp 900ms ease-out forwards;}
  @keyframes floatUp{to{transform:translateY(-34px);opacity:0;}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hud-name">🎀 Catmint Café <span class="tag">test build</span></div>
    <div class="hud-stats">
      <span class="coin">🐚 <b id="coins">0</b></span>
      <span class="level">Lv <b id="level">1</b></span>
      <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
    </div>
  </header>

  <main class="room">
    <div>
      <div class="section-label">Counter — tap a station, pick what to cook</div>
      <div class="counter" id="stations"></div>
    </div>
    <div>
      <div class="section-label">Pass — tap a ready dish to send it out</div>
      <div class="pass" id="pass"></div>
    </div>
    <div>
      <div class="section-label">Floor</div>
      <div class="tables" id="tables"></div>
    </div>
  </main>

  <footer class="toolbar">
    <button id="btnMenu">📖 Menu</button>
    <button id="btnShop">🛍 Shop</button>
  </footer>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="modal" id="modal"></div>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   Catmint Café — v0.1 test build (rev 2)

   rev 1 tied each station directly to one table and auto-started cooking
   the instant a station freed up — the player's only action was tapping
   "Serve!" on a green button. It looked like a game and played like a
   notification tray. Verdict: not playable.

   rev 2 decouples cooking from serving, the way the genre this is actually
   modeled on (Cafe World, and cook-and-serve games generally) does it:
     1. CHOOSE what to cook at an open station (a real decision — you're
        picking against what the floor is currently asking for).
     2. COLLECT the finished dish into the pass when it's done (a tray with
        a hard cap, so over-cooking one thing has a real cost).
     3. SERVE by tapping a ready dish in the pass — it goes to whichever
        waiting cat asked for it, oldest wait first.
   Three taps, three decisions, instead of one passive button. See
   GAME_DESIGN.md for why the loop is shaped this way.
   ========================================================================= */

const SAVE_KEY = "catmintCafe_v0_2";

// ---- content tables ------------------------------------------------------
const RECIPES = [
  { id:"coffee",   name:"Warm Coffee",     icon:"☕", cook:7,  pay:8,   xp:4,  minLevel:1 },
  { id:"pastry",   name:"Butter Pastry",   icon:"🥐", cook:13, pay:16,  xp:8,  minLevel:1 },
  { id:"sandwich", name:"Garden Sandwich", icon:"🥪", cook:20, pay:30,  xp:14, minLevel:2 },
  { id:"latte",    name:"Catmint Latte",   icon:"🧋", cook:26, pay:42,  xp:19, minLevel:3 },
  { id:"cake",     name:"Catmint Cake",    icon:"🍰", cook:36, pay:64,  xp:26, minLevel:4 },
];
const RECIPE_BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));

const CAT_NAMES = ["Biscuit","Clover","Ember","Hazel","Marlow","Pepper","Sable",
  "Toffee","Wren","Sundew","Basil","Pip", "Midknight", "Labubu"];   // the last two: a little cameo, not a real roster link yet

const STATION_DEFS = [
  { id:"brew", name:"Brew Bar",  icon:"☕" },
  { id:"oven", name:"Bake Oven", icon:"🔥" },
];
const PASS_CAP = 4;

const LEVEL_XP = [0, 20, 55, 110, 190, 300, 450];   // xp needed to REACH level n (index = level-1)
function levelForXp(xp) {
  let lvl = 1;
  for (let i = 1; i < LEVEL_XP.length; i++) if (xp >= LEVEL_XP[i]) lvl = i + 1;
  return lvl;
}
function xpIntoLevel(xp, lvl) {
  const base = LEVEL_XP[lvl - 1] ?? LEVEL_XP[LEVEL_XP.length - 1];
  const next = LEVEL_XP[lvl] ?? (base + 220);   // keep climbing past the table so play never hard-stops
  return { base, next, frac: Math.min(1, (xp - base) / (next - base)) };
}
function unlockedRecipes(level) { return RECIPES.filter(r => r.minLevel <= level); }

// ---- state -----------------------------------------------------------
const MAX_TABLES = 3;
const PATIENCE_S = 60;           // how long a cat waits for ITS dish before wandering off — generous on
                                  // purpose: this loop is 3 taps (cook, collect, serve) instead of 1,
                                  // so the margin needs to cover a real player getting distracted mid-shift
const SPAWN_EVERY_S = [5, 11];   // random range between a table opening up and a new customer arriving
const AWAY_CAP_MIN = 20;         // "while you were away" trickle caps here

let coins = 30, xp = 0, tableCount = 2, passIdSeq = 1;
let tables = [];      // { id, cat, hue, want:recipeId|null, waitS, leaving:boolean }
let stations = STATION_DEFS.map(s => ({ ...s, recipeId:null, endsAt:0, duration:0, stuck:false }));
let pass = [];         // { id, recipeId }
let nextSpawnAt = {};  // tableId -> clock value (seconds) of the next spawn attempt

function load() {
  let raw = null;
  // localStorage throws (not just returns null) in a handful of real contexts —
  // private browsing in some browsers, sandboxed iframes/previews — so this
  // needs its own try, not just a bad-JSON guard, or the whole boot dies here.
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { raw = null; }
  const now = Date.now();
  if (raw) {
    coins = raw.coins ?? coins; xp = raw.xp ?? xp; tableCount = raw.tableCount ?? tableCount;
    const awayMin = Math.max(0, Math.min(AWAY_CAP_MIN, (now - (raw.lastSeen || now)) / 60000));
    if (awayMin > 0.5) {
      const tip = Math.round(awayMin * 1.1);
      coins += tip;
      toast(`While you were away: the tip jar picked up 🐚${tip}`);
    }
  }
  for (let i = 0; i < tableCount; i++) tables.push(freshTable(i));
  save();
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ coins, xp, tableCount, lastSeen: Date.now() })); }
  catch (e) { /* no persistence available here — game still plays for the session */ }
}
function freshTable(id) { return { id, cat:null, hue:0, want:null, waitS:0, leaving:false }; }

// ---- economy helpers ---------------------------------------------------
function grantXp(n) {
  const before = levelForXp(xp);
  xp += n;
  const after = levelForXp(xp);
  if (after > before) {
    toast(`Café Level ${after}! ${unlockedRecipes(after).length > unlockedRecipes(before).length ? "A new recipe just unlocked." : "Keep it up."}`);
  }
}

// ---- customers -----------------------------------------------------------
function maybeSpawn(nowS) {
  for (const t of tables) {
    if (t.cat) continue;
    if (nextSpawnAt[t.id] == null) nextSpawnAt[t.id] = nowS + rand(SPAWN_EVERY_S[0], SPAWN_EVERY_S[1]);
    if (nowS >= nextSpawnAt[t.id]) { spawnAt(t); delete nextSpawnAt[t.id]; }
  }
}
function spawnAt(t) {
  const pool = unlockedRecipes(levelForXp(xp));
  const recipe = pool[Math.floor(Math.random() * pool.length)];
  t.cat = CAT_NAMES[Math.floor(Math.random() * CAT_NAMES.length)];
  t.hue = Math.floor(Math.random() * 360);
  t.want = recipe.id;
  t.waitS = 0;
  t.leaving = false;
}
function startTableLeave(t, reason) {
  if (t.leaving) return;
  t.leaving = true;
  if (reason === "wander") toast(`${t.cat} wandered off — no harm done.`);
  setTimeout(() => { t.cat = null; t.want = null; t.waitS = 0; t.leaving = false; }, 380);
}

// ---- cooking: choose -> collect -----------------------------------------
function pickRecipe(stationId, recipeId) {
  const st = stations.find(s => s.id === stationId);
  const recipe = RECIPE_BY_ID[recipeId];
  if (!st || st.recipeId || !recipe) return;
  st.recipeId = recipeId; st.duration = recipe.cook; st.endsAt = performance.now() + recipe.cook * 1000; st.stuck = false;
  render();
}
function collect(stationId) {
  const st = stations.find(s => s.id === stationId);
  if (!st || !st.recipeId || st.endsAt > performance.now()) return;
  if (pass.length >= PASS_CAP) { st.stuck = true; toast("The pass is full — serve something before this burns a hole in the tray."); render(); return; }
  pass.push({ id: passIdSeq++, recipeId: st.recipeId });
  st.recipeId = null; st.endsAt = 0; st.duration = 0; st.stuck = false;
  render();
}

// ---- serving: pass -> best-matching table --------------------------------
function serveFromPass(passItemId) {
  const item = pass.find(p => p.id === passItemId);
  if (!item) return;
  const candidates = tables.filter(t => t.cat && !t.leaving && t.want === item.recipeId);
  if (!candidates.length) { toast("No one's asked for that yet — hang onto it."); return; }
  candidates.sort((a, b) => b.waitS - a.waitS);
  const table = candidates[0];
  const recipe = RECIPE_BY_ID[item.recipeId];
  // full tip under ~20s wait, sliding down to 55% by the time patience nearly
  // runs out — never zero. This is still Catmint Cove; nobody's furious.
  const waitFrac = Math.min(1, table.waitS / PATIENCE_S);
  const pay = Math.max(1, Math.round(recipe.pay * (1 - waitFrac * 0.45)));
  coins += pay; grantXp(recipe.xp);
  floatCoinNearTable(table.id, pay);
  pass = pass.filter(p => p.id !== passItemId);
  startTableLeave(table, "served");
  save(); render();
}
// tapping the customer directly is the same action from the other end —
// whichever a player reaches for first should just work
function serveTable(tableId) {
  const t = tables.find(x => x.id === tableId);
  if (!t || !t.want) return;
  const item = pass.find(p => p.recipeId === t.want);
  if (!item) { toast(`${t.cat} is still waiting on that.`); return; }
  serveFromPass(item.id);
}

// ---- shop ------------------------------------------------------------
function tablePrice() { return 150; }
function buyTable() {
  if (tableCount >= MAX_TABLES) return;
  if (coins < tablePrice()) { toast("Not enough shells yet."); return; }
  coins -= tablePrice();
  tables.push(freshTable(tableCount));
  tableCount++;
  save(); renderShop(); render();
  toast("A new table's out on the floor.");
}

// ---- game loop ---------------------------------------------------------
function tick(now) {
  const dt = 0.2, nowS = now / 1000;
  maybeSpawn(nowS);
  for (const t of tables) {
    if (t.cat && t.want && !t.leaving) {
      t.waitS += dt;
      if (t.waitS >= PATIENCE_S) startTableLeave(t, "wander");
    }
  }
  render();
}

// ---- rendering -----------------------------------------------------------
const $tables = document.getElementById("tables");
const $stations = document.getElementById("stations");
const $pass = document.getElementById("pass");
function render() {
  document.getElementById("coins").textContent = coins;
  const level = levelForXp(xp);
  document.getElementById("level").textContent = level;
  document.getElementById("xpfill").style.width = (xpIntoLevel(xp, level).frac * 100) + "%";

  const wanted = new Set(tables.filter(t => t.cat && !t.leaving).map(t => t.want));
  $stations.innerHTML = stations.map(s => stationHTML(s, level)).join("");
  $pass.innerHTML = passHTML(wanted);
  $tables.innerHTML = tables.map(tableHTML).join("");
}
function stationHTML(s, level) {
  if (!s.recipeId) {
    const chips = unlockedRecipes(level).map(r => `<button class="chip" onclick="onPick('${s.id}','${r.id}')" title="${r.name}">${r.icon}</button>`).join("");
    return `<div class="station"><div class="sname">${s.icon} ${s.name}</div><div class="chip-row">${chips}</div></div>`;
  }
  const recipe = RECIPE_BY_ID[s.recipeId];
  const now = performance.now();
  const ready = s.endsAt <= now;
  const pct = ready ? 100 : Math.max(0, 100 - ((s.endsAt - now) / (s.duration * 1000)) * 100);
  return `<div class="station"><div class="sname">${s.icon} ${s.name}</div>
    <div class="cook-dish">${recipe.icon}</div>
    ${ready
      ? (s.stuck ? `<div class="stuck-note">pass is full!</div>` : `<button class="collect-btn" onclick="onCollect('${s.id}')">Collect</button>`)
      : `<div class="cookbar"><i style="width:${pct}%"></i></div>`}
  </div>`;
}
function passHTML(wanted) {
  const slots = [];
  for (let i = 0; i < PASS_CAP; i++) {
    const item = pass[i];
    if (item) {
      const r = RECIPE_BY_ID[item.recipeId];
      const matched = wanted.has(item.recipeId);
      slots.push(`<div class="pass-slot full" style="${matched ? "" : "animation:none"}" onclick="onServePass(${item.id})" title="${r.name}">${r.icon}</div>`);
    } else {
      slots.push(`<div class="pass-slot empty"></div>`);
    }
  }
  return slots.join("") + (pass.length ? "" : `<span class="pass-hint">nothing ready yet</span>`);
}
function tableHTML(t) {
  if (!t.cat) return `<div class="table empty"><div class="table-top"></div><div class="name">open table</div></div>`;
  const recipe = t.want ? RECIPE_BY_ID[t.want] : null;
  const pct = Math.max(0, 100 - (t.waitS / PATIENCE_S) * 100);
  const cls = "table seated" + (t.leaving ? " leaving" : "");
  return `<div class="${cls}" onclick="onTableTap(${t.id})">
    <div class="table-top">🐱${recipe ? `<div class="want-bubble">${recipe.icon}</div>` : ""}</div>
    <div class="name">${t.cat}</div>
    <div class="patience"><i style="width:${pct}%"></i></div>
  </div>`;
}
function onPick(stationId, recipeId) { pickRecipe(stationId, recipeId); }
function onCollect(stationId) { collect(stationId); }
function onServePass(id) { serveFromPass(id); }
function onTableTap(id) { serveTable(id); }
window.onPick = onPick; window.onCollect = onCollect;
window.onServePass = onServePass; window.onTableTap = onTableTap;

function floatCoinNearTable(tableId, amount) {
  const cards = [...$tables.children];
  const idx = tables.findIndex(t => t.id === tableId);
  const el = cards[idx] || $tables;
  const r = el.getBoundingClientRect();
  const f = document.createElement("div");
  f.className = "floater"; f.textContent = "+" + amount + " 🐚";
  f.style.left = (r.left + r.width / 2 - 20) + "px";
  f.style.top = (r.top) + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 950);
}

// ---- toasts ------------------------------------------------------------
const $toasts = document.getElementById("toasts");
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $toasts.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 300); }, 2600);
}

// ---- modals: menu + shop -----------------------------------------------
const $backdrop = document.getElementById("backdrop");
const $modal = document.getElementById("modal");
function openModal(html) { $modal.innerHTML = html; $backdrop.hidden = false; }
function closeModal() { $backdrop.hidden = true; }
$backdrop.addEventListener("click", e => { if (e.target === $backdrop) closeModal(); });

function renderMenu() {
  const level = levelForXp(xp);
  openModal(`
    <div class="mhead"><h2>The Menu</h2><button class="x" onclick="closeModal()">✕</button></div>
    ${RECIPES.map(r => `
      <div class="recipe-row ${r.minLevel > level ? "locked" : ""}">
        <div class="ic">${r.icon}</div>
        <div class="info"><b>${r.name}</b><span>${r.cook}s cook · pays 🐚${r.pay} · +${r.xp} xp</span></div>
        ${r.minLevel > level ? `<span class="soon-tag">Lv ${r.minLevel}</span>` : ""}
      </div>`).join("")}
  `);
}
function renderShop() {
  const level = levelForXp(xp);
  const canBuyTable = tableCount < MAX_TABLES;
  openModal(`
    <div class="mhead"><h2>Shop</h2><button class="x" onclick="closeModal()">✕</button></div>
    <div class="shop-row">
      <div class="ic">🪑</div>
      <div class="info"><b>Extra table</b><span>${canBuyTable ? `Serve one more cat at a time — 🐚${tablePrice()}` : "Floor's full for this test build"}</span></div>
      ${canBuyTable
        ? `<button class="buy-btn" ${level < 2 ? "disabled" : ""} onclick="buyTable()">${level < 2 ? "Lv 2" : "Buy"}</button>`
        : `<span class="soon-tag">Owned</span>`}
    </div>
    <div class="shop-row">
      <div class="ic">🔥</div>
      <div class="info"><b>Third station</b><span>One more thing cooking at once.</span></div>
      <span class="soon-tag">Soon</span>
    </div>
    <div class="shop-row">
      <div class="ic">✨</div>
      <div class="info"><b>Decor & faster stations</b><span>Cosmetic sets + speed upgrades — no pay-to-win, ever.</span></div>
      <span class="soon-tag">Soon</span>
    </div>
  `);
}
window.closeModal = closeModal;
window.buyTable = buyTable;
document.getElementById("btnMenu").onclick = renderMenu;
document.getElementById("btnShop").onclick = renderShop;

function rand(a, b) { return a + Math.random() * (b - a); }

// ---- boot --------------------------------------------------------------
load();
render();
setInterval(() => tick(performance.now()), 200);
setInterval(save, 5000);
window.addEventListener("beforeunload", save);
</script>
</body>
</html>
